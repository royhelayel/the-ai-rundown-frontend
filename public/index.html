<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="RadioNews — your daily news, read and narrated."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>RadioNews</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // A blank page tells nobody anything. If the app throws before it has drawn a thing
      // (a missing env var at startup, a render error React could not recover from), put the
      // error on screen instead so it can be read off a phone without dev tools.
      (function () {
        function show(msg) {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length) return;
          root.innerHTML =
            '<div style="font-family:-apple-system,system-ui,sans-serif;padding:32px 20px;max-width:520px;margin:0 auto;color:#111">' +
            '<h1 style="font-size:20px;margin:0 0 8px">RadioNews could not load</h1>' +
            '<p style="margin:0 0 16px;color:#555">Something broke while the app was starting. Reloading usually fixes it.</p>' +
            '<button onclick="location.reload()" style="font-size:16px;padding:10px 18px;border-radius:10px;border:0;background:#111;color:#fff">Reload</button>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;margin-top:24px;font-size:12px;color:#888"></pre></div>';
          root.querySelector('pre').textContent = msg;
        }
        function onError(e) {
          var err = e.error;
          var msg = (err && (err.stack || err.message)) || e.message || String(err || 'Unknown error');
          // Let React finish unmounting first; only a root it left empty gets the fallback.
          setTimeout(function () { show(String(msg).slice(0, 1200)); }, 0);
        }
        window.addEventListener('error', onError);
      })();
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
