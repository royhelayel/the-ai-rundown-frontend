<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your RadioNews signup code</title></head>
  <body style="margin:0;background:#f5f5ef;color:#20251c;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
        <tr><td style="padding:0 0 24px;font-size:20px;font-weight:800;letter-spacing:3px;">RADIO<span style="color:#858c80;">NEWS</span></td></tr>
        <tr><td style="padding:28px;background:#ffffff;border-radius:20px;">
          <h1 style="margin:0 0 14px;font-size:24px;line-height:1.2;">Confirm your email</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#596253;">Enter this code in RadioNews to confirm your email and finish signing up.</p>
          <p style="margin:0 0 24px;padding:20px 10px;background:#f5f5ef;border-radius:12px;text-align:center;font-size:30px;font-weight:700;letter-spacing:5px;">{{ .Token }}</p>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#596253;">Keep this code private. If it has expired, request a new code in the app.</p>
        </td></tr>
        <tr><td style="padding:20px 0;font-size:12px;line-height:1.5;color:#747c6e;">If you didn’t request this email, you can ignore it.</td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
