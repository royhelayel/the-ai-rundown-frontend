<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Challenge Ring</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 48px; }
  h2 { font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.3); margin-bottom: 20px; text-align: center; }

  /* Shared icon SVG for headphones */
  .hp-icon { flex-shrink: 0; }
</style>
</head>
<body>

<!-- ══ SECTION 1: Single ring (large, like the reference) ══ -->
<div>
  <h2>Single ring — matches your reference</h2>
  <div style="display:flex;justify-content:center;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">

      <!-- Ring -->
      <div style="position:relative;width:190px;height:190px;">
        <svg width="190" height="190" style="position:absolute;inset:0;transform:rotate(-90deg);">
          <defs>
            <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7c3aed"/>
              <stop offset="60%" stop-color="#4f46e5"/>
              <stop offset="100%" stop-color="#3b82f6"/>
            </linearGradient>
          </defs>
          <!-- Track -->
          <circle cx="95" cy="95" r="80" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>
          <!-- Progress: 7/10 = 70% of 2π×80 ≈ 352 of 503 -->
          <circle cx="95" cy="95" r="80" fill="none" stroke="url(#g1)" stroke-width="10"
            stroke-dasharray="352 503" stroke-linecap="round"/>
        </svg>

        <!-- Inside content -->
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;">

          <!-- Headphone icon -->
          <svg width="34" height="32" viewBox="0 0 56 50" fill="none" style="margin-bottom:4px;">
            <defs>
              <linearGradient id="il" x1="0" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#60a5fa"/>
              </linearGradient>
            </defs>
            <!-- Headband -->
            <path d="M11 26 C11 10 19 5 28 5 C37 5 45 10 45 26"
              stroke="url(#il)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <!-- Left ear cup (near-circle) -->
            <ellipse cx="11" cy="31" rx="7" ry="8" stroke="url(#il)" stroke-width="4.5" fill="none"/>
            <!-- Right ear cup -->
            <ellipse cx="45" cy="31" rx="7" ry="8" stroke="url(#il)" stroke-width="4.5" fill="none"/>
            <!-- News lines -->
            <line x1="18" y1="43" x2="38" y2="43" stroke="url(#il)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="21" y1="47" x2="35" y2="47" stroke="url(#il)" stroke-width="2.5" stroke-linecap="round"/>
          </svg>

          <!-- TODAY label -->
          <span style="font-size:0.58rem;font-weight:800;text-transform:uppercase;letter-spacing:0.12em;color:rgba(255,255,255,0.45);">Today</span>

          <!-- 7 / 10 -->
          <div style="display:flex;align-items:baseline;gap:1px;line-height:1;">
            <span style="font-size:2.2rem;font-weight:900;color:#fff;">7</span>
            <span style="font-size:1rem;font-weight:700;color:rgba(255,255,255,0.35);">/10</span>
          </div>

          <!-- stories -->
          <span style="font-size:0.62rem;font-weight:600;color:rgba(255,255,255,0.35);">stories</span>
        </div>
      </div>

      <!-- Below ring -->
      <span style="font-size:0.65rem;font-weight:600;color:rgba(255,255,255,0.35);letter-spacing:0.01em;">3 stories left</span>
    </div>

  </div>
</div>


<!-- ══ SECTION 2: 3 rings side by side (app size) ══ -->
<div style="width:100%;max-width:420px;">
  <h2>All 3 rings — app size</h2>

  <div style="display:flex;justify-content:space-between;gap:8px;">

    <!-- ─ Ring 1: Today ─ -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="position:relative;width:108px;height:108px;">
        <svg width="108" height="108" style="position:absolute;inset:0;transform:rotate(-90deg);">
          <defs>
            <linearGradient id="g_t" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7c3aed"/>
              <stop offset="100%" stop-color="#3b82f6"/>
            </linearGradient>
          </defs>
          <circle cx="54" cy="54" r="45" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/>
          <circle cx="54" cy="54" r="45" fill="none" stroke="url(#g_t)" stroke-width="7"
            stroke-dasharray="198 283" stroke-linecap="round"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;">
          <!-- Headphone icon -->
          <svg width="20" height="19" viewBox="0 0 56 50" fill="none" style="margin-bottom:3px;">
            <defs><linearGradient id="il_t" x1="0" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient></defs>
            <path d="M11 26 C11 10 19 5 28 5 C37 5 45 10 45 26" stroke="url(#il_t)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <ellipse cx="11" cy="31" rx="7" ry="8" stroke="url(#il_t)" stroke-width="4.5" fill="none"/>
            <ellipse cx="45" cy="31" rx="7" ry="8" stroke="url(#il_t)" stroke-width="4.5" fill="none"/>
            <line x1="18" y1="43" x2="38" y2="43" stroke="url(#il_t)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="21" y1="47" x2="35" y2="47" stroke="url(#il_t)" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span style="font-size:0.4rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.45);">Today</span>
          <div style="display:flex;align-items:baseline;gap:1px;line-height:1;">
            <span style="font-size:1.25rem;font-weight:900;color:#fff;">7</span>
            <span style="font-size:0.55rem;font-weight:700;color:rgba(255,255,255,0.35);">/10</span>
          </div>
          <span style="font-size:0.38rem;font-weight:600;color:rgba(255,255,255,0.3);">stories</span>
        </div>
      </div>
      <span style="font-size:0.46rem;font-weight:600;color:rgba(255,255,255,0.35);text-align:center;">3 stories left</span>
    </div>

    <!-- ─ Ring 2: Streak ─ -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="position:relative;width:108px;height:108px;">
        <svg width="108" height="108" style="position:absolute;inset:0;transform:rotate(-90deg);">
          <defs>
            <linearGradient id="g_s" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <circle cx="54" cy="54" r="45" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/>
          <!-- 2/3 = 66.7% → 188 of 283 -->
          <circle cx="54" cy="54" r="45" fill="none" stroke="url(#g_s)" stroke-width="7"
            stroke-dasharray="188 283" stroke-linecap="round"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;">
          <!-- Lightning icon (Sharp) -->
          <svg width="16" height="20" viewBox="0 0 14 20" fill="none" style="margin-bottom:3px;">
            <path d="M9 2L3 11h6l-2 7L13 9H7z" stroke="url(#g_s_i)" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
            <defs><linearGradient id="g_s_i" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs>
          </svg>
          <span style="font-size:0.4rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.45);">Streak</span>
          <div style="display:flex;align-items:baseline;gap:1px;line-height:1;">
            <span style="font-size:1.25rem;font-weight:900;color:#fff;">2</span>
            <span style="font-size:0.55rem;font-weight:700;color:rgba(255,255,255,0.35);">/3</span>
          </div>
          <span style="font-size:0.38rem;font-weight:600;color:rgba(255,255,255,0.3);">days</span>
        </div>
      </div>
      <span style="font-size:0.46rem;font-weight:600;color:rgba(255,255,255,0.35);text-align:center;">1 day left</span>
    </div>

    <!-- ─ Ring 3: Week ─ -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="position:relative;width:108px;height:108px;">
        <svg width="108" height="108" style="position:absolute;inset:0;transform:rotate(-90deg);">
          <defs>
            <linearGradient id="g_w" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <circle cx="54" cy="54" r="45" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/>
          <!-- 4/7 = 57% → 161 of 283 -->
          <circle cx="54" cy="54" r="45" fill="none" stroke="url(#g_w)" stroke-width="7"
            stroke-dasharray="161 283" stroke-linecap="round"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;">
          <!-- Star icon (Savvy) -->
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="margin-bottom:3px;">
            <defs><linearGradient id="g_w_i" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs>
            <path d="M9 2l1.8 4.2H15l-3.4 2.4 1.3 4.4L9 10.6 5.1 13l1.3-4.4L3 6.2h4.2z" stroke="url(#g_w_i)" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
          </svg>
          <span style="font-size:0.4rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.45);">Week</span>
          <div style="display:flex;align-items:baseline;gap:1px;line-height:1;">
            <span style="font-size:1.25rem;font-weight:900;color:#fff;">4</span>
            <span style="font-size:0.55rem;font-weight:700;color:rgba(255,255,255,0.35);">/7</span>
          </div>
          <span style="font-size:0.38rem;font-weight:600;color:rgba(255,255,255,0.3);">days</span>
        </div>
      </div>
      <span style="font-size:0.46rem;font-weight:600;color:rgba(255,255,255,0.35);text-align:center;">3 days left</span>
    </div>

  </div>
</div>

</body>
</html>
